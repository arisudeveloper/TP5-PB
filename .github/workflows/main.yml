name: "Workflow TP5"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend JAR
        run: |
          cd TP4-PB-Backend
          mvn clean package -DskipTests

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: TP4-PB-Backend/target/*.jar

      - name: Static Analysis (Checkstyle/Security)
        run: |
          cd TP4-PB-Backend
          mvn checkstyle:check || echo "Avisos no Checkstyle"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Run Services
        run: |
          cd TP4-PB-Frontend
          npm install
          npm run dev & 
          
          cd ../TP4-PB-Backend/target
          nohup java -jar *.jar > backend-log.txt 2>&1 &
          
          echo "Aguardando serviços"
          sleep 15 

      - name: Run Tests
        run: |
          cd TP4-PB-Backend
          mvn test

      - name: Create Job Summary
        if: always()
        run: |
          echo "## Deploy TP5" >> $GITHUB_STEP_SUMMARY
          echo "* **Status do Build:** Success" >> $GITHUB_STEP_SUMMARY
          echo "* **Análise SAST:** Feita " >> $GITHUB_STEP_SUMMARY
          echo "* **URL de Produção:** [Link do Railway](https://frontend-production-ef1c.up.railway.app)" >> $GITHUB_STEP_SUMMARY
          echo "Artefatos gerados e testes concluídos." >> $GITHUB_STEP_SUMMARY

      - name: Upload Jacoco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: TP4-PB-Backend/target/site/jacoco/