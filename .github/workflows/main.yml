name: "Workflow TP5"

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Jar)
        run: |
          cd TP4-PB-Backend
          mvn clean package -DskipTests

      - name: Run Tests
        run: |
          cd TP4-PB-Backend
          mvn test -DtestFailureIgnore=true

      - name: Upload Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-do-projeto
          path: |
            TP4-PB-Backend/target/*.jar
            TP4-PB-Backend/target/site/jacoco/

      - name: Resumo 
        if: always()
        run: |
          echo "## Relatório de Automação TP5" >> $GITHUB_STEP_SUMMARY
          echo "1. **Build:** Backend compilado com sucesso." >> $GITHUB_STEP_SUMMARY
          echo "2. **Testes:** Execução de testes unitários e Selenium  finalizada." >> $GITHUB_STEP_SUMMARY
          echo "3. **Artefatos:** JAR e Relatórios de Cobertura disponíveis no GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "4. **Ambiente Real:** https://frontend-production-ef1c.up.railway.app" >> $GITHUB_STEP_SUMMARY